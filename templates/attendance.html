<!DOCTYPE html>
<html>
<head>
    <title>Attendance Tracker</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            padding:40px;
        }

        .container{
            background:white;
            padding:30px;
            max-width:500px;
            margin:auto;
            border-radius:15px;
        }

        input{
            padding:10px;
            width:90%;
            margin:10px 0;
        }

        button{
            padding:10px 20px;
        }
    </style>

</head>
<body>

<div class="container">

<h1>📊 Attendance Tracker</h1>

<form method="POST">

    <label>Classes Attended</label><br>
    <input type="number" name="attended" required>

    <br>

    <label>Total Classes</label><br>
    <input type="number" name="total" required>

    <br><br>

    <button type="submit">
        Calculate
    </button>

</form>

{% if percentage is not none %}

<h2>
<h2>
Attendance: {{ "%.2f"|format(percentage) }} %
</h2>
</h2>
<h3>{{ status }}</h3>

{% endif %}

</div>

</body>
</html>
